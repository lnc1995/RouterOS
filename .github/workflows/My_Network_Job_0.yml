name: My_Network_Job_0

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: HandleCNIP
      run: sh ./Scripts/HandleCNIP.sh

    - name: HandleGFWDomains
      run: sh ./Scripts/HandleGFWDomains.sh
        
    - name: HandleGoogle&CNDomains
      run: sh "./Scripts/HandleGoogle&CNDomains.sh"
      
    - name: Commit
      run : |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        git commit -m "$(date +%Y-%m-%d" "%H:%M:%S)" --allow-empty
        git push -f
